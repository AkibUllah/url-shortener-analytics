[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener-analytics"
version = "0.1.0"
description = "FastAPI URL shortener with click analytics, QR codes, password-protected links and Redis-backed hot redirects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
dependencies = [
    "fastapi>=0.110,<0.160",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "segno>=1.6",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "ruff>=0.4",
]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["shortener*"]

[tool.setuptools.package-data]
shortener = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:shortener.*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["shortener", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["shortener"]
